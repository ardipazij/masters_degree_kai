[project]
name = "azs-tft-dashboard"
version = "0.1.0"
description = "TFT-анализ продаж АЗС и дашборд"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.1",
    "lightning>=2.1",
    "pytorch-forecasting>=1.0.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "streamlit>=1.28",
    "plotly>=5.18",
    "matplotlib>=3.7",
]

[project.scripts]
azs-train-tft = "azs_tft.train:main"
azs-dashboard = "azs_tft.dashboard:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
azs_tft = ["data_dictionary.json"]
